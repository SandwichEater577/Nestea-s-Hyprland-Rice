# Portable text/Hyprlang fallback. Installer writes per-machine monitors.conf.
$mainMod = SUPER
$terminal = kitty
$menu = rofi -show drun
source = ~/.config/rice/monitors.conf
monitor = , preferred, auto, auto

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
exec-once = ~/.local/bin/start-bar
exec-once = hyprpaper
exec-once = ~/.local/bin/change-wallpaper --restore
exec-once = mako
exec-once = systemctl --user start hyprpolkitagent.service
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hypridle
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 1
    layout = dwindle
    col.active_border = rgba(999999cc)
    col.inactive_border = rgba(44444499)
}
decoration {
    rounding = 8
    blur {
        enabled = true
        size = 3
        passes = 2
    }
    shadow {
        enabled = true
        range = 8
        render_power = 3
        color = rgba(00000030)
    }
}
animations {
    enabled = true
    bezier = restrained, 0.2, 0.8, 0.2, 1.0
    animation = windows, 1, 3, restrained
    animation = fade, 1, 2, default
    animation = workspaces, 1, 3, restrained, fade
}
dwindle {
    preserve_split = true
}
input {
    kb_layout = us
    sensitivity = 0
    touchpad {
        tap-to-click = true
        disable_while_typing = true
        natural_scroll = true
    }
}
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}
# Launcher and window controls match the desktop PC.
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, R, exec, $menu
bind = $mainMod, C, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, TAB, cyclenext,
bind = $mainMod, TAB, bringactivetotop,
bind = $mainMod, T, exec, ~/.local/bin/change-wallpaper
bind = $mainMod, E, exec, thunar
bind = $mainMod SHIFT, V, exec, ~/.local/bin/clipboard-menu
bind = $mainMod, L, exec, ~/.local/bin/lock-screen
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = , Print, exec, ~/.local/bin/screenshot full
bind = $mainMod SHIFT, S, exec, ~/.local/bin/screenshot region
bindel = , XF86AudioRaiseVolume, exec, ~/.local/bin/desktop-menu audio up
bindel = , XF86AudioLowerVolume, exec, ~/.local/bin/desktop-menu audio down
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# Physical F4 reports MicMute with Fn Lock in the media-key position.
bindl = , XF86AudioMicMute, exec, ~/.local/bin/desktop-menu audio boost
bindl = $mainMod SHIFT, XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, ~/.local/bin/rice-media next
bindel = , XF86MonBrightnessDown, exec, ~/.local/bin/rice-media previous
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bind = $mainMod, 1, workspace, 1
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# F4 toggles the volume ceiling; F5/F6 work with Fn-lock either on or off.
bindl = , F4, exec, ~/.local/bin/desktop-menu audio boost
bindl = $mainMod SHIFT, F4, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = , F5, exec, ~/.local/bin/rice-media previous
bind = , F6, exec, ~/.local/bin/rice-media next
